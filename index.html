  // Player count range from Q2

    if (!g) return false;
    if (g.min > pMax || g.max < pMin) return false;
    if (q2==='kis' && noWith2.includes(id)) return false;
    if ((q1==='csald' || q1==='barat') && kidsOnly.includes(id)) return false;
    return true;
  }

  const swap = {
    myFirstActivity: 'papayaBoats',
    theCrew:         'clips',
    theGang:         'xoxo',
    wizard:          'vigyazz6',
    aranyasok:       'vigyazz6',
    nomad:           'hiddenStones',
    meisterMakatsu:  'vigyazz6',
    quickStop:       'halliGalli',
    elixirus:        'clips',
    frogSplash:      'halliGalli',
    krokoLoko:       'papayaBoats',
    memoett:         'papayaBoats',
  };

  function fix(ids) {
    return ids.map(id => {
      if (fits(id)) return id;
      const alt = swap[id];
      if (alt && fits(alt) && !ids.includes(alt)) return alt;
      const all = Object.keys(G);
      for (const k of all) { if (fits(k) && !ids.includes(k)) return k; }
      return id;
    });
  }

  let result;

  // GYEREKEKKEL
  if (q1==='gyerek') {
    if (q4==='4-6') {
      if (q5==='gyors')        result = ['frogSplash','krokoLoko'];

      else                     result = ['memoett','pickAChicken'];

      if (q5==='gyors')        result = ['halliGalli','fourMation'];
      else if (q5==='kozepes') result = ['papayaBoats','pickAChicken'];

    } else {
      if (q5==='gyors')        result = ['theCrew','xoxo'];
      else if (q5==='kozepes') result = ['elixirus','theCrew'];
      else                     result = ['nomad','theGang'];
    }
  }

  // BARÁTOKKAL
  else if (q1==='barat') {
    if (q4==='hangos') {
      if (q5==='gyors')        result = ['halliGalli','vigyazz6'];
      else if (q5==='kozepes') result = ['vigyazz6','meisterMakatsu'];
      else                     result = ['aranyasok','vigyazz6'];
    } else if (q4==='kozepes') {
      if (q5==='gyors')        result = ['quickStop','cardia'];
      else if (q5==='kozepes') result = ['wizard','clips'];
      else                     result = ['theCrew','aranyasok'];
    } else {
      if (q5==='gyors')        result = ['threeMotion','cardia'];
      else if (q5==='kozepes') result = ['theCrew','theGang'];
      else                     result = ['nomad','clips'];
    }
  }

  else { result = ['halliGalli','papayaBoats']; }

  result = fix(result);
  if (result[0] === result[1]) {
    const all = Object.keys(G);
    for (const k of all) {
      if (k !== result[0] && fits(k)) { result[1] = k; break; }
    }
  }
  return result;
}

let screen='start', step=0, ans={}, seq=[];

function buildSeq() {
  return ['q1','q2','q3', ans.q1==='gyerek'?'q4a':'q4b', 'q5'];
}

const app = document.getElementById('app');

function render() {
  app.innerHTML =
    screen==='start'  ? renderStart() :
    screen==='quiz'   ? renderQuiz()  :
                        renderResults();
}

function renderStart() {
  return `<div class="card">
    <span class="s-emoji">🎲</span>
    <h1 class="s-title">Melyik társas a befutó?</h1>
    <p class="s-desc">5 gyors kérdés, és megtaláljuk számodra a tökéletes játékot, legyen szó gyerekekkel töltött időről, családi játékról, vagy társasjáték estről a barátaiddal.</p>
    <button class="btn-go" onclick="startQuiz()">Kezdjük el! →</button>
    <p class="s-note">5 kérdés · ~1 perc</p>
  </div>`;
}

function renderQuiz() {
  const q = Qs[seq[step]];
  const dots = [0,1,2,3,4].map(i =>
    `<div class="dot ${i<step?'done':i===step?'active':''}"></div>`
  ).join('');
  const opts = q.opts.map(o =>
    `<button class="opt" data-v="${o.v}" onclick="pick('${o.v}')">${o.l}</button>`
  ).join('');
  return `
    <div class="dots">${dots}</div>
    <div class="card">
      <span class="q-emoji">${q.e}</span>
      <div class="q-text">${q.text}</div>
      <div class="opts">${opts}</div>
    </div>
    <p class="q-foot">${step+1} / 5</p>`;
}

function renderResults() {
  const [pk,sk] = getResult(ans);
  const pg=G[pk], sg=G[sk];
  return `<div class="card">
    <div class="r-tag">🎉 Megvan a tökéletes játék!</div>
    <h2 class="r-title">Ezeket ajánljuk neked:</h2>
    <p class="r-sub">A legjobb találat elől van – de mindkettő megér egy próbát!</p>
    <div class="gg">
      ${gc(pg,true)}
      ${gc(sg,false)}
    </div>
    <button class="btn-again" onclick="restart()">↺ Újrakezdem</button>
  </div>`;
}

function gc(g, primary) {
  return `<div class="gc ${primary?'p1':''}">
    ${primary?'<span class="badge">⭐ Legjobb találat</span>':''}
    <span class="ge">${g.e}</span>
    <div class="gn">${g.name}</div>
    <div class="gt">${g.tag}</div>
    <div class="gd">${g.desc}</div>
    <div class="gm">
      <span class="chip">🎂 ${g.age}</span>
      <span class="chip">👥 ${g.p}</span>
      <span class="chip">⏱ ${g.t}</span>
    </div>
    <a href="${g.url}" target="_blank" rel="noopener" class="gl ${primary?'pa':'sa'}">
      Megnézem →
    </a>
  </div>`;
}

function startQuiz() {
  screen='quiz'; step=0; ans={}; seq=['q1','q2','q3','_','q5'];
  render();
}

function pick(val) {
  const qk = seq[step];
  const ak = (qk==='q4a'||qk==='q4b') ? 'q4' : qk;
  ans[ak] = val;
  if (qk==='q1') seq = buildSeq();
  document.querySelectorAll('.opt').forEach(b => {
    if (b.getAttribute('data-v')===val) b.classList.add('sel');
  });
  setTimeout(() => {
    step++;
    if (step>=5) screen='results';
    render();
  }, 280);
}

function restart() {
  screen='start'; step=0; ans={}; seq=[];
  render();
}

render();

</script>
